<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>천상흔 · 기록고 입장</title>
<link rel="icon" href="./favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="./favicon-64.png">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png"><style>
:root{--title:'Gowun Batang','Noto Serif KR',serif;--body:'Noto Serif KR',serif}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:var(--body);background:#0d0c0b;color:#fff}body{min-height:100vh;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 20% 25%,rgba(181,147,91,.08),transparent 32%),#0d0c0b}body:before{content:"";position:fixed;inset:-10%;opacity:.13;pointer-events:none;background:repeating-radial-gradient(circle at 20% 30%,transparent 0 70px,rgba(193,159,99,.16) 71px 72px,transparent 73px 145px)}.wrap{position:relative;z-index:1;width:min(880px,92vw);display:grid;grid-template-columns:210px 1fr;box-shadow:0 35px 90px rgba(0,0,0,.42)}.side{border:1px solid rgba(255,255,255,.13);background:rgba(17,15,13,.78);padding:34px 26px;display:flex;align-items:center;flex-direction:column}.side h2{writing-mode:vertical-rl;font-family:var(--title);font-weight:400;font-size:31px;letter-spacing:.28em;margin:0}.rule{width:1px;flex:1;min-height:90px;background:linear-gradient(transparent,rgba(255,255,255,.24),transparent);margin:22px 0}.side small{font-size:8px;letter-spacing:.2em;color:rgba(255,255,255,.36)}.paper{background:linear-gradient(180deg,#eee4d8,#dfd1c1);color:#281f1a;padding:50px}.k{font-size:8px;letter-spacing:.25em;color:#948677}.paper h1{font-family:var(--title);font-weight:400;font-size:36px;margin:6px 0 10px}.paper p{font-size:10px;line-height:1.8;color:#71645a;margin:0 0 24px}.badge{font-size:8px;letter-spacing:.16em;color:#88786a;margin-bottom:18px}.field{margin:13px 0}.field label{display:block;font-size:8px;letter-spacing:.12em;color:#7d7065;margin-bottom:6px}.field input{width:100%;border:1px solid rgba(44,34,28,.17);background:rgba(255,255,255,.42);padding:12px;outline:none;font:inherit}.field input:focus{background:rgba(255,255,255,.6);border-color:rgba(65,52,43,.42)}button{width:100%;margin-top:8px;padding:13px;border:0;background:#2b241f;color:#fff;font:inherit;font-size:10px;cursor:pointer}.err{min-height:18px;color:#994d43;font-size:9px;margin-top:10px}.links{margin-top:18px;font-size:9px}.links a{color:#76695d;text-decoration:none}.notice{font-size:9px;color:#916b35;margin-bottom:10px}@media(max-width:700px){.wrap{grid-template-columns:1fr}.side{display:none}.paper{padding:34px 24px}}</style></head><body><div class="wrap"><aside class="side"><h2>記錄庫</h2><div class="rule"></div><small>AUTHORIZED ONLY</small></aside><main class="paper"><div class="k">PRIVATE ARCHIVE ACCESS</div><h1>기록고 입장</h1><p>공동 관리 계정으로 입장하면 별도의 관리자 화면이 아니라 천상흔 홈페이지로 돌아가며, 이야기·인물·기록 페이지 안에서 직접 작성하고 수정할 수 있습니다.</p><div class="badge">3 OPERATORS · 1 SHARED ACCOUNT</div><div id="notice" class="notice"></div><div id="loginFields"><div class="field"><label>공동 관리 계정</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>암호</label><input id="password" type="password" autocomplete="current-password"></div></div><button id="login">홈페이지 편집 모드로 입장</button><button id="logout" style="display:none;background:#6f6257">공동 관리자 로그아웃</button><div id="err" class="err"></div><div class="links"><a href="./index.html">← 홈페이지로 돌아가기</a></div></main></div><script type="module">import{firebaseConfig,ADMIN_UID}from'./firebase-config.js';import{initializeApp}from'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';import{getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut,setPersistence,browserLocalPersistence}from'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';const $=s=>document.querySelector(s);const unconfigured=Object.values(firebaseConfig).some(v=>String(v).includes('PASTE_'))||ADMIN_UID.includes('PASTE_');let signedAdmin=false;function setLoggedInUI(on){signedAdmin=on;$('#loginFields').style.display=on?'none':'block';$('#logout').style.display=on?'block':'none';$('#login').textContent=on?'편집 모드로 입장':'홈페이지 편집 모드로 입장';$('#notice').textContent=on?'이미 공동 관리자 계정으로 로그인되어 있습니다.':'공동 관리 계정으로 로그인해 주세요.'}if(unconfigured){$('#notice').textContent='Firebase 연결 전입니다. firebase-config.js를 먼저 채워 주세요.';$('#login').disabled=true;$('#login').style.opacity=.45}else{const app=initializeApp(firebaseConfig),auth=getAuth(app);await setPersistence(auth,browserLocalPersistence);onAuthStateChanged(auth,async u=>{if(u&&u.uid===ADMIN_UID){setLoggedInUI(true)}else if(u){await signOut(auth);setLoggedInUI(false);$('#err').textContent='공동 관리 계정이 아닙니다.'}else setLoggedInUI(false)});$('#login').onclick=async()=>{if(signedAdmin){location.href='./index.html?edit=1#story';return}try{$('#err').textContent='';await signInWithEmailAndPassword(auth,$('#email').value.trim(),$('#password').value);location.href='./index.html?edit=1#story'}catch(e){$('#err').textContent='입장에 실패했습니다. 계정과 암호를 확인해 주세요.'}};$('#logout').onclick=async()=>{await signOut(auth);$('#err').textContent='로그아웃되었습니다.'};$('#password').addEventListener('keydown',e=>{if(e.key==='Enter')$('#login').click()})}</script></body></html>
